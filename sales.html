<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artome — Sales Stock</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Sales-specific overrides */
  .sales-wrap { display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  .sales-topbar {
    padding:.9rem 1.4rem;
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:.8rem;
    background:var(--surface);
    flex-shrink:0;
  }
  .sales-title {
    font-size:.58rem; font-weight:700; letter-spacing:.16em;
    text-transform:uppercase; color:var(--muted);
    display:flex; align-items:center; gap:.6rem;
  }
  .sales-title::after { content:''; flex:1; height:1px; background:var(--border); }
  .sales-actions { display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; }
  .sales-search-wrap {
    display:flex; align-items:center; gap:.4rem;
    background:var(--surface2); border:1px solid var(--border2);
    border-radius:var(--radius); padding:.32rem .8rem;
  }
  .sales-search-wrap svg { color:var(--muted); flex-shrink:0; }
  .sales-search-wrap input {
    background:transparent; border:none; outline:none;
    color:var(--text); font-family:'Barlow',sans-serif;
    font-size:.65rem; width:14rem;
  }
  .sales-search-wrap input::placeholder { color:var(--muted); }
  .group-tabs {
    display:flex; gap:.4rem;
  }
  .group-tab {
    padding:.38rem .9rem;
    border-radius:var(--radius);
    border:1px solid var(--border2);
    background:transparent;
    color:var(--text2);
    font-family:'Barlow',sans-serif;
    font-size:.65rem; font-weight:700;
    letter-spacing:.04em; text-transform:uppercase;
    cursor:pointer;
    transition:border-color .12s, color .12s, background .12s;
  }
  .group-tab:hover { border-color:var(--accent); color:var(--accent); }
  .group-tab.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .sales-table-wrap { overflow-y:auto; flex:1; }
  .item-count {
    font-family:'DM Mono',monospace; font-size:.67rem;
    background:var(--surface2); border:1px solid var(--border2);
    padding:.2rem .7rem; border-radius:2px; color:var(--accent);
    white-space:nowrap;
  }
  /* Bigger available number for sales */
  td.avail-cell {
    font-family:'Barlow Condensed',sans-serif;
    font-size:1rem; font-weight:700;
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 260 60" height="50" xmlns="http://www.w3.org/2000/svg">
        <polygon points="0,52 18,8 28,8 46,52 36,52 28,30 24,19 20,30 12,52" fill="#ffffff"/>
        <polygon points="12,40 22,40 18,52 8,52" fill="#F5620F"/>
        <text x="56" y="50" font-family="Barlow,Arial,sans-serif" font-weight="800" font-size="44" letter-spacing="1" fill="#ffffff">RTOME</text>
      </svg>
    </div>
    <div class="login-divider"></div>
    <p class="login-subtitle">Sales — Stock View</p>
    <div class="login-field">
      <input type="password" id="login-input" placeholder="Enter password"
        autocomplete="current-password" onkeydown="if(event.key==='Enter') doLogin()">
      <button class="login-btn" onclick="doLogin()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>
    <div class="login-error" id="login-error">Incorrect password</div>
  </div>
</div>

<!-- APP -->
<div class="sales-wrap" id="sales-app" style="display:none">
  <header>
    <div class="logo">
      <svg viewBox="0 0 260 60" height="30" xmlns="http://www.w3.org/2000/svg">
        <polygon points="0,52 18,8 28,8 46,52 36,52 28,30 24,19 20,30 12,52" fill="#ffffff"/>
        <polygon points="12,40 22,40 18,52 8,52" fill="#F5620F"/>
        <text x="56" y="50" font-family="Barlow,Arial,sans-serif" font-weight="800" font-size="44" letter-spacing="1" fill="#ffffff">RTOME</text>
      </svg>
      <div class="logo-separator"></div>
      <div class="logo-sub">Sales<br>Stock View</div>
    </div>
    <div class="header-center" id="connection-status">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-label">Loading…</span>
    </div>
    <div class="header-meta">
      <div id="live-time">--:--:--</div>
      <div id="live-date"></div>
    </div>
  </header>

  <div class="sales-topbar">
    <div style="display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;">
      <span class="item-count" id="item-count">— items</span>
      <!-- Group filter tabs -->
      <div class="group-tabs">
        <button class="group-tab active" onclick="setGroup('all', this)">All</button>
        <button class="group-tab" onclick="setGroup('platforms', this)">Platforms</button>
        <button class="group-tab" onclick="setGroup('accessories', this)">Accessories</button>
      </div>
    </div>
    <div class="sales-actions">
      <div class="sales-search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="sales-search" placeholder="Search parts…" oninput="applyFilters()">
      </div>
      <button class="action-btn" onclick="loadSalesStock()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Refresh
      </button>
    </div>
  </div>

  <div class="sales-table-wrap">
    <div class="loading-state" id="sales-loading">
      <div class="spinner"></div>Loading stock…
    </div>
    <table id="sales-table" style="display:none">
      <thead>
        <tr>
          <th>Part No</th>
          <th>Description</th>
          <th>Group</th>
          <th>Available</th>
        </tr>
      </thead>
      <tbody id="sales-tbody"></tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script>
// ── Config ────────────────────────────────────────────────────
const SALES_PASSWORD   = 'sales2026'; // Change this in config.js or here
const MRPEASY_PROXY    = SUPABASE_URL + '/functions/v1/mrpeasy-proxy';

// Groups to include (MRPeasy group_code values)
const ALLOWED_GROUPS = ['03-Artome Platforms', '04-Artome Accessories'];
// Partial match — group_title contains these strings
const GROUP_PLATFORMS   = 'Platforms';
const GROUP_ACCESSORIES = 'Accessories';

// ── State ─────────────────────────────────────────────────────
let allItems     = [];
let activeGroup  = 'all';
let _authed      = false;

// ── Clock ─────────────────────────────────────────────────────
function startClock() {
  const tick = () => {
    const now = new Date();
    const tEl = document.getElementById('live-time');
    const dEl = document.getElementById('live-date');
    if (tEl) tEl.textContent = now.toLocaleTimeString('en-GB');
    if (dEl) dEl.textContent = now.toLocaleDateString('en-GB', {weekday:'short',day:'2-digit',month:'short',year:'numeric'});
  };
  tick(); setInterval(tick, 1000);
}

// ── Login ─────────────────────────────────────────────────────
function doLogin() {
  const input = document.getElementById('login-input');
  const error = document.getElementById('login-error');
  const field = document.querySelector('.login-field');

  if (input.value === SALES_PASSWORD) {
    _authed = true;
    const screen = document.getElementById('login-screen');
    screen.classList.add('hidden');
    setTimeout(() => {
      screen.remove();
      document.getElementById('sales-app').style.display = 'flex';
      document.getElementById('sales-app').style.flexDirection = 'column';
      startClock();
      loadSalesStock();
    }, 400);
  } else {
    field.classList.remove('shake');
    void field.offsetWidth;
    field.classList.add('shake');
    error.classList.add('visible');
    input.value = '';
    input.focus();
    setTimeout(() => error.classList.remove('visible'), 2500);
  }
}

// ── Status ────────────────────────────────────────────────────
function setStatus(state, label) {
  const dot = document.getElementById('status-dot');
  const lbl = document.getElementById('status-label');
  if (dot) dot.className = 'status-dot ' + state;
  if (lbl) lbl.textContent = label;
}

// ── Load Stock ────────────────────────────────────────────────
async function loadSalesStock() {
  setStatus('connecting', 'Loading…');
  document.getElementById('sales-loading').style.display = 'flex';
  document.getElementById('sales-table').style.display   = 'none';

  try {
    const res = await fetch(MRPEASY_PROXY + '?endpoint=items', {
      headers: {
        'apikey':        SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
      }
    });

    const json = await res.json();
    let parsed = json;
    if (json.data && typeof json.data === 'string') {
      try { parsed = JSON.parse(json.data); } catch(e) {}
    }

    const items = Array.isArray(parsed) ? parsed : [];

    // Filter: only Platforms & Accessories groups, and active (custom_7453 not blank)
    allItems = items.filter(item => {
      const grp    = (item.group_title ?? '').toLowerCase();
      const active = item.custom_7453;
      const hasGroup = grp.includes('platform') || grp.includes('accessor');
      const isActive = active !== null && active !== undefined && active !== '';
      return hasGroup && isActive;
    });

    setStatus('connected', 'Connected');
    applyFilters();

    document.getElementById('sales-loading').style.display = 'none';
    document.getElementById('sales-table').style.display   = 'table';

  } catch(e) {
    setStatus('error', 'Failed');
    document.getElementById('sales-loading').innerHTML =
      '<div style="color:var(--danger);font-size:.7rem">Failed to load: ' + e.message + '</div>';
  }
}

// ── Group filter ──────────────────────────────────────────────
function setGroup(group, btn) {
  activeGroup = group;
  document.querySelectorAll('.group-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

// ── Apply filters ─────────────────────────────────────────────
function applyFilters() {
  const q = (document.getElementById('sales-search')?.value ?? '').toLowerCase();

  let filtered = allItems.filter(item => {
    const grp = (item.group_title ?? '').toLowerCase();
    if (activeGroup === 'platforms'   && !grp.includes('platform'))  return false;
    if (activeGroup === 'accessories' && !grp.includes('accessor'))  return false;
    if (q) {
      const matchCode  = (item.code  ?? '').toLowerCase().includes(q);
      const matchTitle = (item.title ?? '').toLowerCase().includes(q);
      if (!matchCode && !matchTitle) return false;
    }
    return true;
  });

  renderTable(filtered);
}

// ── Render ────────────────────────────────────────────────────
function renderTable(items) {
  const tbody = document.getElementById('sales-tbody');
  document.getElementById('item-count').textContent = items.length + ' items';

  if (!items.length) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:2rem">No items found</td></tr>';
    return;
  }

  tbody.innerHTML = items.map(item => {
    const available = parseFloat(item.available ?? item.in_stock ?? 0);
    const qtyClass  = available <= 0 ? 'stock-qty-zero' : available < 3 ? 'stock-qty-low' : 'stock-qty-ok';
    const group     = item.group_title ?? '—';

    return `<tr>
      <td class="date-cell">${item.code ?? '—'}</td>
      <td class="name-cell" style="white-space:normal;max-width:20rem">${item.title ?? '—'}</td>
      <td class="date-cell" style="color:var(--text2)">${group}</td>
      <td class="avail-cell ${qtyClass}">${available.toLocaleString('en-GB',{maximumFractionDigits:0})}</td>
    </tr>`;
  }).join('');
}

// ── Toast ─────────────────────────────────────────────────────
function showToast(msg, warn=false) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.style.background = warn ? '#e84040' : 'var(--accent)';
  el.style.color = '#fff';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2400);
}

// ── Start clock on load (shows on login screen) ───────────────
window.addEventListener('DOMContentLoaded', startClock);
</script>
</body>
</html>
